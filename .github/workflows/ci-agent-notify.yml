name: Agent Notify CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "agent_notify/**"
      - ".github/workflows/ci-agent-notify.yml"
  pull_request:
    branches: [main]
    paths:
      - "agent_notify/**"
      - ".github/workflows/ci-agent-notify.yml"

jobs:
  lint:
    name: Lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check agent_notify/ --select E,F,I,UP,B,SIM --ignore E501
      - run: ruff format agent_notify/ --check --diff

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
        working-directory: agent_notify
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        working-directory: agent_notify
