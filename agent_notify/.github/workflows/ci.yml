name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run python -m pytest tests/ -v --tb=short
        working-directory: agent_notify

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pytest tests/ -v --tb=short
        working-directory: agent_notify

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ruff
        run: pip install ruff

      - name: Check syntax
        run: ruff check agent_notify/ --select E,F,I,UP,B,SIM --ignore E501
        working-directory: .

      - name: Check formatting
        run: ruff format agent_notify/ --check --diff
        working-directory: .

  build:
    runs-on: windows-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Build exe
        run: pyinstaller agent_notify.spec --noconfirm
        working-directory: agent_notify

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentNotify-${{ github.sha }}
          path: agent_notify/dist/AgentNotify.exe
