name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    name: 测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

  build:
    name: 构建 exe + 安装包
    needs: test
    runs-on: windows-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Build exe with PyInstaller
        run: |
          pyinstaller agent_notify.spec --noconfirm

      - name: Verify exe exists
        run: |
          if (Test-Path "dist/AgentNotify.exe") { echo "✓ AgentNotify.exe built" } else { echo "✗ Build failed"; exit 1 }

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Verify installer
        run: |
          if (Test-Path "output/AgentNotifySetup.exe") { echo "✓ Installer built" } else { echo "✗ Installer failed"; exit 1 }

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentNotify-exe
          path: dist/AgentNotify.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentNotify-setup
          path: output/AgentNotifySetup.exe

  release:
    name: 发布 Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download exe artifact
        uses: actions/download-artifact@v4
        with:
          name: AgentNotify-exe
          path: release/

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: AgentNotify-setup
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/AgentNotify.exe
            release/AgentNotifySetup.exe
          generate_release_notes: true
          draft: false
          prerelease: false
